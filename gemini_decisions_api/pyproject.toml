[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisions-demo"
version = "0.1.0"
description = "Demo of the Gemini Decisions API in plain Python and in an ADK agent."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["decisions_demo*", "decisions_agent*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: calls the real API. Needs GEMINI_API_KEY or Vertex AI settings.",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
# The notebook is for reading. Its cells favour short, flat code over lint rules.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
