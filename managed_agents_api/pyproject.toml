[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "managed-agents-demo"
version = "0.1.0"
description = "Demo of the Managed Agents API on Gemini Enterprise Agent Platform."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["managed_agents_demo*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: calls the real API. Needs GOOGLE_CLOUD_PROJECT and RUN_INTEGRATION=1.",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
