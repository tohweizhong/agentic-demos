<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="'Google Sans', Roboto, Arial, sans-serif">
  <title>GEAP starter pack governance tiers</title>
  <desc>A pyramid of five governance tiers. Tier 1 is the base and is always on. Each higher tier adds one control and one Terraform variable. Tiers 4 and 5 need the domain restricted sharing setup.</desc>
  <rect x="0" y="0" width="1180" height="560" fill="#ffffff"/>

  <!-- Arrow: add tiers from the bottom up -->
  <line x1="14" y1="510" x2="14" y2="50" stroke="#5f6368" stroke-width="2"/>
  <polygon points="14,36 6,54 22,54" fill="#5f6368"/>
  <text x="34" y="290" font-size="14" fill="#5f6368" transform="rotate(-90 34 290)" text-anchor="middle">Add tiers from the bottom up</text>

  <!-- Bands. Pyramid center x = 420. Half width = 70 + 320 * (y - 30) / 480. -->
  <!-- Tier 5: y 30 to 126 -->
  <polygon points="350,30 490,30 554,126 286,126" fill="#e8f0fe" stroke="#ffffff" stroke-width="3"/>
  <text x="420" y="72" font-size="16" font-weight="700" fill="#174ea6" text-anchor="middle">Tier 5</text>
  <text x="420" y="94" font-size="14" fill="#174ea6" text-anchor="middle">Inbound Client Control</text>
  <text x="420" y="113" font-size="12" fill="#174ea6" text-anchor="middle">Ingress gateway</text>

  <!-- Tier 4: y 126 to 222 -->
  <polygon points="286,126 554,126 618,222 222,222" fill="#d2e3fc" stroke="#ffffff" stroke-width="3"/>
  <text x="420" y="166" font-size="16" font-weight="700" fill="#174ea6" text-anchor="middle">Tier 4</text>
  <text x="420" y="188" font-size="14" fill="#174ea6" text-anchor="middle">Content Safety</text>
  <text x="420" y="207" font-size="12" fill="#174ea6" text-anchor="middle">Model Armor on the gateways</text>

  <!-- Tier 3: y 222 to 318 -->
  <polygon points="222,222 618,222 682,318 158,318" fill="#aecbfa" stroke="#ffffff" stroke-width="3"/>
  <text x="420" y="262" font-size="16" font-weight="700" fill="#174ea6" text-anchor="middle">Tier 3</text>
  <text x="420" y="284" font-size="14" fill="#174ea6" text-anchor="middle">Outbound Access Control</text>
  <text x="420" y="303" font-size="12" fill="#174ea6" text-anchor="middle">Egress gateway and IAP policy (DRY_RUN or ENFORCE)</text>

  <!-- Tier 2: y 318 to 414 -->
  <polygon points="158,318 682,318 746,414 94,414" fill="#669df6" stroke="#ffffff" stroke-width="3"/>
  <text x="420" y="358" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Tier 2</text>
  <text x="420" y="380" font-size="14" fill="#ffffff" text-anchor="middle">Catalog and Discovery</text>
  <text x="420" y="399" font-size="12" fill="#ffffff" text-anchor="middle">Agent Registry: approved MCP servers and APIs</text>

  <!-- Tier 1: y 414 to 510 -->
  <polygon points="94,414 746,414 810,510 30,510" fill="#1a73e8" stroke="#ffffff" stroke-width="3"/>
  <text x="420" y="454" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Tier 1</text>
  <text x="420" y="476" font-size="14" fill="#ffffff" text-anchor="middle">Identity and Runtime Baseline</text>
  <text x="420" y="495" font-size="12" fill="#ffffff" text-anchor="middle">Agent Identity, Agent Runtime, MCP server on Cloud Run, regional logs</text>

  <!-- Right column: variable and organization policy change -->
  <text x="850" y="22" font-size="13" font-weight="700" fill="#3c4043">Terraform variable</text>

  <text x="850" y="76" font-size="13" fill="#202124" font-family="'Roboto Mono', monospace">enable_ingress_gateway = true</text>
  <text x="850" y="96" font-size="12" fill="#b06000">Needs domain restricted sharing setup</text>

  <text x="850" y="170" font-size="13" fill="#202124" font-family="'Roboto Mono', monospace">enable_model_armor = true</text>
  <text x="850" y="190" font-size="12" fill="#b06000">Needs domain restricted sharing setup</text>
  <text x="850" y="208" font-size="12" font-weight="700" fill="#3c4043">Default in terraform.tfvars.example</text>

  <text x="850" y="266" font-size="13" fill="#202124" font-family="'Roboto Mono', monospace">enable_egress_gateway = true</text>
  <text x="850" y="286" font-size="12" fill="#137333">No organization policy change</text>
  <text x="850" y="304" font-size="12" font-weight="700" fill="#3c4043">Recommended first production step</text>

  <text x="850" y="362" font-size="13" fill="#202124" font-family="'Roboto Mono', monospace">enable_agent_registry = true</text>
  <text x="850" y="382" font-size="12" fill="#137333">No organization policy change</text>

  <text x="850" y="458" font-size="13" fill="#202124">Always on</text>
  <text x="850" y="478" font-size="12" fill="#137333">No organization policy change</text>

  <!-- Dashed guides from bands to the right column -->
  <g stroke="#dadce0" stroke-width="1" stroke-dasharray="4 4">
    <line x1="530" y1="78" x2="840" y2="78"/>
    <line x1="594" y1="174" x2="840" y2="174"/>
    <line x1="658" y1="270" x2="840" y2="270"/>
    <line x1="722" y1="366" x2="840" y2="366"/>
    <line x1="786" y1="462" x2="840" y2="462"/>
  </g>
</svg>
