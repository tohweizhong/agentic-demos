[project]
name = "agy-im8-agent"
version = "0.1.0"
description = "Autonomous Multi-Agent IM8 Compliance Checking and Remediation Companion"
authors = [
    {name = "Weizhong Toh"},
]

dependencies = [
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
]
requires-python = ">=3.10,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
